name: Score Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-scoring:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
           pip install pandas numpy joblib requests shap lightgbm sqlalchemy psycopg2-binary pyarrow

      - name: Run scoring script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATA_DIR: '.'
        run: |
          python score_hourly.py
